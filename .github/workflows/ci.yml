name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-unit:
    name: Backend Lint & Unit Tests (SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r backend/requirements.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app backend/tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats formatting/style warnings as non-fatal
          flake8 backend/app backend/tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests

  backend-scenarios:
    name: Backend Live Scenarios (Postgres + PostGIS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: roadsense
          POSTGRES_USER: roadsense
          POSTGRES_PASSWORD: roadsense
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://roadsense:roadsense@localhost:5432/roadsense
      PYTHONPATH: backend
      JWT_SECRET: test-ci-secret-key-for-roadsense
      PLATE_HASH_KEY: test-ci-plate-hash-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Seed default reviewer account
        run: |
          python -m app.db.seed

      - name: Start FastAPI server
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          echo "Server process launched in background"

      - name: Wait for API health check
        run: |
          python -c "
          import urllib.request, time, sys
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2) as resp:
                      if resp.status == 200:
                          print(f'API is healthy after {attempt+1} attempts')
                          sys.exit(0)
              except Exception:
                  pass
              time.sleep(1)
          print('API failed to respond to health check!')
          sys.exit(1)
          "

      - name: Run synthetic burst scenarios (9 scenarios)
        run: |
          python backend/scripts/generate_synthetic_bursts.py --base-url http://127.0.0.1:8000

      - name: Output server logs if job failed
        if: failure()
        run: |
          if [ -f server.log ]; then
            echo "=== FastAPI Server Logs ==="
            cat server.log
          fi

  frontend:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
